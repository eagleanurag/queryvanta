# Local developer infrastructure only.
# Envoy grpc-web proxy in front of the queryvanta-spark Spark Connect
# server. Browsers cannot speak raw gRPC, so the PySpark browser
# client talks grpc-web to :8081 and Envoy translates to gRPC on
# the Spark Connect server (:15002). Adapted from the
# pyspark-connect-web deploy stack (Apache-2.0).
admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: 9901 }

static_resources:
  listeners:
    - name: grpcweb_listener
      address:
        socket_address: { address: 0.0.0.0, port_value: 8081 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: grpcweb
                codec_type: AUTO
                # Spark Connect streams ExecutePlan responses; do not
                # buffer or time out long-lived streams.
                stream_idle_timeout: 0s
                route_config:
                  name: grpcweb_route
                  virtual_hosts:
                    - name: grpcweb_host
                      domains: ["*"]
                      # The calling page is cross-origin isolated
                      # (COOP/COEP); allow it to read this cross-origin
                      # grpc-web response under COEP.
                      response_headers_to_add:
                        - header:
                            key: "Cross-Origin-Resource-Policy"
                            value: "cross-origin"
                          append_action: OVERWRITE_IF_EXISTS_OR_ADD
                      # Local QueryVanta dev origins (Vite serves on :5173).
                      cors:
                        allow_origin_string_match:
                          - exact: "http://localhost:5173"
                          - exact: "http://127.0.0.1:5173"
                        allow_methods: "GET, POST, OPTIONS"
                        # Must cover every non-safelisted header the
                        # grpc-web transport sends (content-type,
                        # x-grpc-web, grpc-accept-encoding, accept)
                        # PLUS per-call gRPC metadata, which PySpark
                        # forwards as HTTP headers - notably
                        # `transport` from sc://...;transport=grpcweb.
                        # A requested header missing here makes the
                        # browser block the POST even though Envoy
                        # answers the preflight 200.
                        allow_headers: "accept,content-type,x-grpc-web,grpc-accept-encoding,transport,x-user-agent,custom-header-1"
                        expose_headers: "grpc-status,grpc-message"
                        max_age: "1728000"
                      routes:
                        - match: { prefix: "/" }
                          route:
                            cluster: spark-connect
                            timeout: 0s
                            max_stream_duration:
                              grpc_timeout_header_max: 0s
                http_filters:
                  - name: envoy.filters.http.grpc_web
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.grpc_web.v3.GrpcWeb
                  - name: envoy.filters.http.cors
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.Cors
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    # Spark Connect is plain gRPC over HTTP/2 (h2c, no TLS) inside the
    # compose network; explicit_http_config below forces HTTP/2.
    - name: spark-connect
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: spark-connect
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: spark
                      port_value: 15002
